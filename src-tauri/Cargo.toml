[package]
name = "trae-skill-manager"
version = "1.0.0"
description = "TRAE Skill Manager - Search, browse and install Agent Skills"
authors = ["you"]
edition = "2021"

[lib]
name = "trae_skill_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
dirs = "5"
urlencoding = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39.6"
getrandom = "0.2"
tower-http = { version = "0.6", features = ["cors"] }
# 启用 formatting feature 以支持 OffsetDateTime::to_rfc3339（updater 的 pub_date）
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = true
strip = true
