[package]
name = "skills-core"
version = "1.1.0"
description = "TRAE Skill Manager core logic (no Tauri dependency, shared by GUI/CLI/MCP)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
dirs = "5"
urlencoding = "2"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39.6"
